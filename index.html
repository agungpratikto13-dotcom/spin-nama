<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Undian Bola - Created by Agung</title>

<style>

/* =====================================================
   DASAR
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:url("background.jpg") center/cover no-repeat fixed;

    font-family:Arial,sans-serif;

    display:flex;
    flex-direction:column;
    align-items:center;

    color:white;

    overflow-x:hidden;

}

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.60);

    z-index:-1;

}


/* =====================================================
   JUDUL
===================================================== */

h1{

    margin-top:18px;
    margin-bottom:12px;

    text-align:center;

    color:#FFD700;

    font-size:clamp(20px,4vw,34px);

    text-shadow:
        2px 3px 5px #000,
        0 0 15px #FFD700;

}


/* =====================================================
   MESIN
===================================================== */

.machine{

    width:min(94vw,520px);

    position:relative;

    display:flex;
    flex-direction:column;
    align-items:center;

}


/* =====================================================
   TABUNG
===================================================== */

.glass{

    width:390px;
    max-width:90vw;

    height:300px;

    position:relative;

    overflow:hidden;

    border:7px solid #FFD700;

    border-radius:45px 45px 30px 30px;

    background:

        linear-gradient(
            90deg,
            rgba(255,255,255,.25),
            rgba(255,255,255,.04) 20%,
            rgba(255,255,255,.04) 80%,
            rgba(255,255,255,.22)
        ),

        rgba(10,20,30,.75);

    box-shadow:

        inset 0 0 35px rgba(255,255,255,.15),

        inset 0 -20px 30px rgba(0,0,0,.5),

        0 0 15px #FFD700,

        0 0 40px rgba(255,215,0,.35);

}


/* kilau kaca */

.glass::before{

    content:"";

    position:absolute;

    top:10px;
    left:20px;

    width:50px;
    height:250px;

    border-radius:50%;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.4),
            rgba(255,255,255,0)
        );

    transform:rotate(5deg);

    pointer-events:none;

    z-index:30;

}


/* =====================================================
   BOLA
===================================================== */

.ball{

    width:52px;
    height:52px;

    border-radius:50%;

    position:absolute;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:4px;

    text-align:center;

    font-size:11px;

    font-weight:bold;

    color:#111;

    border:2px solid rgba(255,255,255,.8);

    box-shadow:

        inset -9px -11px 14px rgba(0,0,0,.32),

        inset 8px 8px 12px rgba(255,255,255,.55),

        0 6px 8px rgba(0,0,0,.55);

    z-index:5;

    transition:
        left .28s ease,
        top .28s ease;

}


/* kilau bola */

.ball::before{

    content:"";

    position:absolute;

    width:13px;
    height:13px;

    border-radius:50%;

    top:7px;
    left:9px;

    background:rgba(255,255,255,.85);

}


/* =====================================================
   SELUNCURAN
===================================================== */

.slide-area{

    width:320px;

    height:230px;

    position:relative;

}


/* kiri */

.slide-left{

    position:absolute;

    left:35px;
    top:0;

    width:24px;
    height:210px;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #555,
            #eee,
            #777
        );

    transform:rotate(25deg);

    transform-origin:top;

    box-shadow:3px 5px 8px #000;

}


/* kanan */

.slide-right{

    position:absolute;

    right:35px;
    top:0;

    width:24px;
    height:210px;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #555,
            #eee,
            #777
        );

    transform:rotate(-25deg);

    transform-origin:top;

    box-shadow:-3px 5px 8px #000;

}


/* bawah */

.slide-bottom{

    position:absolute;

    bottom:15px;

    left:50%;

    transform:translateX(-50%);

    width:110px;
    height:30px;

    border-radius:15px;

    background:
        linear-gradient(
            #eee,
            #666
        );

    box-shadow:
        0 5px 10px #000;

}


/* =====================================================
   BOLA HASIL
===================================================== */

.result-ball{

    position:absolute;

    bottom:-2px;

    left:50%;

    transform:translateX(-50%);

    width:115px;
    height:115px;

    border-radius:50%;

    display:none;

    justify-content:center;
    align-items:center;

    text-align:center;

    color:#111;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    background:

        radial-gradient(
            circle at 30% 22%,
            #fff 0%,
            #ff7675 12%,
            #e84118 45%,
            #8b0000 100%
        );

    border:6px solid #FFD700;

    box-shadow:

        inset -15px -17px 20px rgba(0,0,0,.4),

        inset 10px 10px 15px rgba(255,255,255,.55),

        0 0 15px #FFD700,

        0 0 40px rgba(255,215,0,.65),

        0 12px 20px rgba(0,0,0,.7);

    z-index:50;

}


.result-ball.show{

    display:flex;

    animation:
        bolaKeluar .8s cubic-bezier(.2,1.4,.4,1),
        bolaGoyang 1s 1s infinite alternate;

}


@keyframes bolaKeluar{

    0%{

        transform:
            translate(-50%,-160px)
            scale(.2);

        opacity:0;

    }

    70%{

        transform:
            translate(-50%,10px)
            scale(1.12);

        opacity:1;

    }

    100%{

        transform:
            translate(-50%,0)
            scale(1);

    }

}


@keyframes bolaGoyang{

    from{

        transform:
            translate(-50%,0)
            rotate(-5deg);

    }

    to{

        transform:
            translate(-50%,0)
            rotate(5deg);

    }

}


/* kilau */

.result-ball::before{

    content:"";

    position:absolute;

    width:23px;
    height:23px;

    border-radius:50%;

    top:12px;
    left:17px;

    background:white;

    opacity:.9;

}


/* =====================================================
   OVERLAY PEMENANG
===================================================== */

.winner-overlay{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    background:
        radial-gradient(
            circle,
            rgba(255,215,0,.20),
            rgba(0,0,0,.88) 65%
        );

    z-index:999;

}


.winner-overlay.show{

    display:flex;

    animation:
        munculOverlay .4s ease;

}


@keyframes munculOverlay{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}


.winner-small{

    color:#FFD700;

    font-size:22px;

    font-weight:bold;

    text-shadow:
        0 0 10px #FFD700,
        2px 2px 5px black;

    animation:
        turun .5s ease;

}


.winner-name{

    margin:15px 20px;

    text-align:center;

    color:white;

    font-size:clamp(45px,12vw,90px);

    font-weight:900;

    text-transform:uppercase;

    text-shadow:

        0 0 8px white,

        0 0 20px #FFD700,

        0 0 40px #FFD700,

        4px 5px 5px #000;

    animation:
        zoomNama .8s cubic-bezier(.17,1.4,.4,1);

}


.winner-text{

    color:#FFD700;

    font-size:32px;

    font-weight:bold;

    text-shadow:
        0 0 15px #FFD700,
        2px 2px 5px black;

    animation:
        munculText .8s .3s both;

}


.winner-close{

    margin-top:30px;

    padding:12px 30px;

    border:none;

    border-radius:12px;

    background:#00b894;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 15px black;

}


@keyframes zoomNama{

    0%{

        transform:
            scale(.1)
            rotate(-8deg);

        opacity:0;

    }

    60%{

        transform:
            scale(1.2)
            rotate(2deg);

        opacity:1;

    }

    100%{

        transform:
            scale(1)
            rotate(0);

    }

}


@keyframes turun{

    from{

        transform:
            translateY(-50px);

        opacity:0;

    }

    to{

        transform:
            translateY(0);

        opacity:1;

    }

}


@keyframes munculText{

    from{

        transform:
            scale(.3);

        opacity:0;

    }

    to{

        transform:
            scale(1);

        opacity:1;

    }

}


/* =====================================================
   CONFETTI
===================================================== */

.confetti{

    position:fixed;

    width:10px;
    height:18px;

    top:-30px;

    z-index:1001;

    pointer-events:none;

    animation:
        confettiJatuh
        3s
        linear
        forwards;

}


@keyframes confettiJatuh{

    0%{

        transform:
            translateY(0)
            rotate(0);

        opacity:1;

    }

    100%{

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:.1;

    }

}


/* =====================================================
   TOMBOL
===================================================== */

button{

    margin-top:12px;

    padding:12px 24px;

    border:none;

    border-radius:11px;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 10px rgba(0,0,0,.5);

    transition:.2s;

}


button:hover{

    transform:scale(1.04);

}


button:active{

    transform:scale(.96);

}


button:disabled{

    background:#555 !important;

    cursor:not-allowed;

    transform:none;

}


#drawButton{

    background:#00b894;

}


#nextButton{

    display:none;

    background:#0984e3;

}


#smokeButton{

    display:none;

    background:#d63031;

}


#restoreButton{

    display:none;

    background:#6c5ce7;

}


/* =====================================================
   TEKS
===================================================== */

#petunjuk{

    min-height:25px;

    margin-top:3px;

    text-align:center;

    font-size:16px;

    font-weight:bold;

    text-shadow:2px 2px 4px black;

}


#hasil{

    min-height:42px;

    margin-top:12px;

    text-align:center;

    font-size:28px;

    font-weight:bold;

    color:white;

    text-shadow:
        2px 2px 5px black,
        0 0 12px white;

}


/* =====================================================
   TIMER
===================================================== */

#timer{

    margin-top:8px;

    font-size:31px;

    font-weight:bold;

    color:#00ffcc;

    text-shadow:
        2px 2px 5px black,
        0 0 10px #00ffcc;

}


#timer.merah{

    color:red;

    text-shadow:
        2px 2px 5px black,
        0 0 12px red;

}


/* =====================================================
   CREATED BY
===================================================== */

.created-by{

    margin:15px 0 20px;

    color:#FFD700;

    font-size:16px;

    font-weight:bold;

    text-shadow:
        2px 2px 5px black,

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:450px){

    .glass{

        height:270px;

    }

    .ball{

        width:45px;

        width:100px;

    }

    #hasil{

        font-size:23px;

    }

    #timer{

        font-size:27px;

    }

}

</style>

</head>

<script>

/* =====================================================
   DATA
===================================================== */

let nama = [

    "Agung",
    "Kojek",
    "Tio",
    "Baim",
    "Dafa",
    "Nanda",
    "Aji",
    "Roy"

];


let warna = [

    "#ff7675",
    "#74b9ff",
    "#55efc4",
    "#ffeaa7",
    "#a29bfe",
    "#fd79a8",
    "#81ecec",
    "#fab1a0"

];


/* =====================================================
   VARIABLE
===================================================== */

let sedang = false;

let pemenangSementara = "";

let namaTerpilihSekarang = "";

let namaKeluar = [];

let timerInterval;

let gerakanTimer = null;


/* =====================================================
   ELEMENT
===================================================== */

const glass =
    document.getElementById("glass");

const resultBall =
    document.getElementById("resultBall");

const drawButton =
    document.getElementById("drawButton");


/* =====================================================
   GAMBAR BOLA
===================================================== */

function gambarBola(){

    glass.innerHTML = "";


    if(nama.length === 0){

        glass.innerHTML = `

            <div style="
                width:100%;
                text-align:center;
                padding-top:125px;
                color:#FFD700;
                font-size:24px;
                font-weight:bold;
                text-shadow:0 0 10px #FFD700;
            ">

                SEMUA NAMA HABIS

            </div>

        `;

        return;

    }


    nama.forEach((orang,index)=>{

        const ball =
            document.createElement("div");


        ball.className = "ball";


        ball.textContent = orang;


        ball.style.background =

            `radial-gradient(
                circle at 30% 22%,
                #ffffff 0%,
                ${warna[index]} 18%,
                ${warna[index]} 65%,
                #333 100%
            )`;


        const maxX =
            Math.max(
                5,
                glass.clientWidth - 60
            );


        const maxY =
            Math.max(
                5,
                glass.clientHeight - 60
            );


        ball.style.left =
            Math.random() * maxX + "px";


        ball.style.top =
            Math.random() * maxY + "px";


        glass.appendChild(ball);

    });

}


/* =====================================================
   GERAKAN BOLA
===================================================== */

function mulaiGerakanBola(){

    const balls =
        document.querySelectorAll(".ball");


    if(gerakanTimer){

        clearInterval(
            gerakanTimer
        );

    }


    gerakanTimer =
        setInterval(()=>{

            if(!sedang) return;


            balls.forEach(ball=>{

                const maxX =
                    Math.max(
                        5,
                        glass.clientWidth - 60
                    );


                const maxY =
                    Math.max(
                        5,
                        glass.clientHeight - 60
                    );


                ball.style.left =
                    Math.random() * maxX + "px";


                ball.style.top =
                    Math.random() * maxY + "px";

            });

        },260);

}


/* =====================================================
   HENTIKAN GERAKAN
===================================================== */

function hentikanGerakanBola(){

    if(gerakanTimer){

        clearInterval(
            gerakanTimer
        );

        gerakanTimer = null;

    }

}


/* =====================================================
   MULAI UNDIAN
===================================================== */

function mulaiUndian(){

    if(sedang) return;


    if(nama.length === 0){

        alert(
            "Semua nama sudah habis!"
        );

        return;

    }


    sedang = true;


    drawButton.disabled = true;


    document.getElementById(
        "hasil"
    ).innerHTML = "";


    document.getElementById(
        "petunjuk"
    ).innerHTML =
        "🎱 BOLA SEDANG DIKOCOK...";


    resultBall.classList.remove(
        "show"
    );


    /*
    Pilih pemenang secara acak.
    */

    const index =
        Math.floor(
            Math.random() * nama.length
        );


    pemenangSementara =
        nama[index];


    /*
    Mulai gerakan.
    */

    mulaiGerakanBola();


    /*
    Durasi undian 4 detik.
    */

    setTimeout(()=>{

        sedang = false;


        hentikanGerakanBola();


        document.getElementById(
            "petunjuk"
        ).innerHTML =
            "👇 BOLA KELUAR! TEKAN UNTUK MEMBUKA";


        resultBall.classList.add(
            "show"
        );


    },4000);

}


/* =====================================================
   BUKA HASIL
===================================================== */

function bukaHasil(){

    if(sedang) return;


    if(pemenangSementara === ""){

        return;

    }


    const pemenang =
        pemenangSementara;


    const index =
        nama.indexOf(pemenang);


    /*
    Simpan untuk restore.
    */

    if(index !== -1){

        namaKeluar.push({

            nama:nama[index],

            warna:warna[index]

        });


        /*
        Hapus nama dari undian.
        */

        nama.splice(index,1);

        warna.splice(index,1);

    }


    namaTerpilihSekarang =
        pemenang;


    pemenangSementara = "";


    /*
    Sembunyikan bola.
    */

    resultBall.classList.remove(
        "show"
    );


    /*
    Tampilkan overlay.
    */

    document.getElementById(
        "winnerName"
    ).textContent =
        pemenang;


    document.getElementById(
        "winnerOverlay"
    ).classList.add(
        "show"
    );


    /*
    Confetti.
    */

    buatConfetti();


    /*
    Update bola.
    */

    gambarBola();

}


/* =====================================================
   CONFETTI
===================================================== */

function buatConfetti(){

    const colors = [

        "#FFD700",
        "#ff7675",
        "#74b9ff",
        "#55efc4",
        "#fd79a8",
        "#ffffff"

    ];


    for(
        let i=0;
        i<80;
        i++
    ){

        const c =
            document.createElement(
                "div"
            );


        c.className =
            "confetti";


        c.style.left =
            Math.random()*100 + "vw";


        c.style.background =
            colors[
                Math.floor(
                    Math.random()
                    * colors.length
                )
            ];


        c.style.animationDelay =
            Math.random()*1.5 + "s";


        c.style.transform =
            `rotate(
                ${Math.random()*360}deg
            )`;


        document.body.appendChild(c);


        setTimeout(()=>{

            c.remove();

        },4500);

    }

}


/* =====================================================
   TUTUP PEMENANG
===================================================== */

function tutupPemenang(){

    document.getElementById(
        "winnerOverlay"
    ).classList.remove(
        "show"
    );


    document.getElementById(
        "hasil"
    ).innerHTML =

        "🏆 " +
        namaTerpilihSekarang +
        " TERPILIH!";


    document.getElementById(
        "petunjuk"
    ).innerHTML =
        "🎉 Pemenang telah ditentukan";


    document.getElementById(
        "nextButton"
    ).style.display =
        "inline-block";


    document.getElementById(
        "smokeButton"
    ).style.display =
        "inline-block";


    document.getElementById(
        "restoreButton"
    ).style.display =
        "inline-block";


    drawButton.disabled = false;


    if(nama.length === 0){

        drawButton.innerHTML =
            "🎉 SEMUA SELESAI";

        drawButton.disabled = true;

    }

}


/* =====================================================
   NEXT
===================================================== */

function nextPerson(){

    document.getElementById(
        "hasil"
    ).innerHTML =

        "➡️ " +
        namaTerpilihSekarang +
        " Lewat (Tidak Merokok)";


    document.getElementById(
        "nextButton"
    ).style.display =
        "none";


    document.getElementById(
        "smokeButton"
    ).style.display =
        "none";


    namaTerpilihSekarang = "";

}


/* =====================================================
   MEROKOK
===================================================== */

function merokok(){

    document.getElementById(
        "hasil"
    ).innerHTML =

        "🚬 " +
        namaTerpilihSekarang +
        " Merokok - Waktu 20 Menit";


    document.getElementById(
        "nextButton"
    ).style.display =
        "none";


    document.getElementById(
        "smokeButton"
    ).style.display =
        "none";


    namaTerpilihSekarang = "";


    mulaiTimer();

}


/* =====================================================
   TIMER 20 MENIT
===================================================== */

function mulaiTimer(){

    let menit = 20;
    let detik = 0;

    const timer =
        document.getElementById("timer");

    const fastButton =
        document.getElementById("fastTimerButton");

    drawButton.disabled = true;

    drawButton.innerHTML =
        "⏳ Timer Sedang Berjalan";

    // LANGSUNG tampilkan tombol percepat
    fastButton.style.display = "inline-block";

    clearInterval(timerInterval);

    timer.classList.remove("merah");

    timer.innerHTML =
        "⏱️ Waktu: 20:00";

    timerInterval = setInterval(() => {

        if (menit === 0 && detik === 0) {

            clearInterval(timerInterval);

            timer.innerHTML =
                "🚭 WAKTU SELESAI";

            drawButton.disabled = false;

            drawButton.innerHTML =
                "🎲 MULAI UNDIAN";

            fastButton.style.display = "none";

            return;
        }

        if (detik === 0) {

            menit--;
            detik = 59;

        } else {

            detik--;

        }

        if (menit === 0) {

            timer.classList.add("merah");

        }

        const m =
            String(menit).padStart(2, "0");

        const d =
            String(detik).padStart(2, "0");

        timer.innerHTML =
            "⏱️ Waktu: " + m + ":" + d;

    }, 1000);
}

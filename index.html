<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Undian Bola - Created by Agung</title>

<style>

/* =========================================================
   RESET & DASAR
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    min-height: 100%;
}

body {
    min-height: 100vh;

    background:
        url("background.jpg")
        center / cover
        no-repeat
        fixed;

    font-family: Arial, sans-serif;

    display: flex;
    flex-direction: column;
    align-items: center;

    color: white;

    overflow-x: hidden;

    position: relative;
}

/* Lapisan gelap background */
body::before {
    content: "";

    position: fixed;
    inset: 0;

    background: rgba(0, 0, 0, 0.60);

    z-index: -1;
}


/* =========================================================
   JUDUL
========================================================= */

h1 {
    margin: 18px 12px 12px;

    text-align: center;

    color: #FFD700;

    font-size: clamp(20px, 4vw, 34px);

    text-shadow:
        2px 3px 5px #000,
        0 0 15px #FFD700;
}


/* =========================================================
   MESIN
========================================================= */

.machine {
    width: min(94vw, 520px);

    position: relative;

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* =========================================================
   TABUNG / GLASS
========================================================= */

.glass {
    width: 390px;
    max-width: 90vw;

    height: 300px;

    position: relative;

    overflow: hidden;

    border: 7px solid #FFD700;

    border-radius: 45px 45px 30px 30px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.25),
            rgba(255,255,255,.04) 20%,
            rgba(255,255,255,.04) 80%,
            rgba(255,255,255,.22)
        ),
        rgba(10,20,30,.75);

    box-shadow:
        inset 0 0 35px rgba(255,255,255,.15),
        inset 0 -20px 30px rgba(0,0,0,.5),
        0 0 15px #FFD700,
        0 0 40px rgba(255,215,0,.35);
}


/* Kilau kaca */
.glass::before {
    content: "";

    position: absolute;

    top: 10px;
    left: 20px;

    width: 50px;
    height: 250px;

    border-radius: 50%;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.4),
            rgba(255,255,255,0)
        );

    transform: rotate(5deg);

    pointer-events: none;

    z-index: 30;
}


/* =========================================================
   BOLA PESERTA
========================================================= */

.ball {
    width: 52px;
    height: 52px;

    border-radius: 50%;

    position: absolute;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 4px;

    text-align: center;

    font-size: 11px;
    font-weight: bold;

    color: #111;

    border: 2px solid rgba(255,255,255,.8);

    box-shadow:
        inset -9px -11px 14px rgba(0,0,0,.32),
        inset 8px 8px 12px rgba(255,255,255,.55),
        0 6px 8px rgba(0,0,0,.55);

    z-index: 5;

    transition:
        left .28s ease,
        top .28s ease;
}


/* Kilau bola */
.ball::before {
    content: "";

    position: absolute;

    width: 13px;
    height: 13px;

    border-radius: 50%;

    top: 7px;
    left: 9px;

    background: rgba(255,255,255,.85);
}


/* =========================================================
   SELUNCURAN
========================================================= */

.slide-area {
    width: 320px;
    height: 230px;

    position: relative;
}


/* Kiri */
.slide-left {
    position: absolute;

    left: 35px;
    top: 0;

    width: 24px;
    height: 210px;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #555,
            #eee,
            #777
        );

    transform: rotate(25deg);
    transform-origin: top;

    box-shadow: 3px 5px 8px #000;
}


/* Kanan */
.slide-right {
    position: absolute;

    right: 35px;
    top: 0;

    width: 24px;
    height: 210px;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #555,
            #eee,
            #777
        );

    transform: rotate(-25deg);
    transform-origin: top;

    box-shadow: -3px 5px 8px #000;
}


/* Bawah */
.slide-bottom {
    position: absolute;

    bottom: 15px;
    left: 50%;

    transform: translateX(-50%);

    width: 110px;
    height: 30px;

    border-radius: 15px;

    background:
        linear-gradient(
            #eee,
            #666
        );

    box-shadow:
        0 5px 10px #000;
}


/* =========================================================
   BOLA HASIL
========================================================= */

.result-ball {
    position: absolute;

    bottom: -2px;
    left: 50%;

    transform: translateX(-50%);

    width: 115px;
    height: 115px;

    border-radius: 50%;

    display: none;

    justify-content: center;
    align-items: center;

    text-align: center;

    color: #111;

    font-size: 13px;
    font-weight: bold;

    cursor: pointer;

    background:
        radial-gradient(
            circle at 30% 22%,
            #fff 0%,
            #ff7675 12%,
            #e84118 45%,
            #8b0000 100%
        );

    border: 6px solid #FFD700;

    box-shadow:
        inset -15px -17px 20px rgba(0,0,0,.4),
        inset 10px 10px 15px rgba(255,255,255,.55),
        0 0 15px #FFD700,
        0 0 40px rgba(255,215,0,.65),
        0 12px 20px rgba(0,0,0,.7);

    z-index: 50;
}

.result-ball.show {
    display: flex;

    animation:
        bolaKeluar .8s cubic-bezier(.2,1.4,.4,1) forwards;
}


/* Animasi keluar */
@keyframes bolaKeluar {

    0% {
        transform:
            translate(-50%, -160px)
            scale(.2);

        opacity: 0;
    }

    70% {
        transform:
            translate(-50%, 10px)
            scale(1.12);

        opacity: 1;
    }

    100% {
        transform:
            translate(-50%, 0)
            scale(1);
    }
}


/* Animasi goyang dipisahkan */
.result-ball.goyang {
    animation: bolaGoyang 1s infinite alternate ease-in-out;
}

@keyframes bolaGoyang {

    from {
        transform:
            translateX(-50%)
            rotate(-5deg);
    }

    to {
        transform:
            translateX(-50%)
            rotate(5deg);
    }
}


/* Kilau bola hasil */
.result-ball::before {
    content: "";

    position: absolute;

    width: 23px;
    height: 23px;

    border-radius: 50%;

    top: 12px;
    left: 17px;

    background: white;

    opacity: .9;
}


/* =========================================================
   OVERLAY PEMENANG
========================================================= */

.winner-overlay {
    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    padding: 20px;

    background:
        radial-gradient(
            circle,
            rgba(255,215,0,.20),
            rgba(0,0,0,.88) 65%
        );

    z-index: 999;
}

.winner-overlay.show {
    display: flex;

    animation:
        munculOverlay .4s ease;
}


@keyframes munculOverlay {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


.winner-small {
    color: #FFD700;

    font-size: 22px;
    font-weight: bold;

    text-align: center;

    text-shadow:
        0 0 10px #FFD700,
        2px 2px 5px black;

    animation:
        turun .5s ease;
}


.winner-name {
    margin: 15px 20px;

    max-width: 95vw;

    text-align: center;

    color: white;

    font-size: clamp(45px, 12vw, 90px);

    font-weight: 900;

    text-transform: uppercase;

    word-break: break-word;

    text-shadow:
        0 0 8px white,
        0 0 20px #FFD700,
        0 0 40px #FFD700,
        4px 5px 5px #000;

    animation:
        zoomNama .8s cubic-bezier(.17,1.4,.4,1);
}


.winner-text {
    color: #FFD700;

    font-size: 32px;
    font-weight: bold;

    text-align: center;

    text-shadow:
        0 0 15px #FFD700,
        2px 2px 5px black;

    animation:
        munculText .8s .3s both;
}


.winner-close {
    margin-top: 30px;

    padding: 12px 30px;

    border: none;

    border-radius: 12px;

    background: #00b894;

    color: white;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 15px black;
}


@keyframes zoomNama {

    0% {
        transform:
            scale(.1)
            rotate(-8deg);

        opacity: 0;
    }

    60% {
        transform:
            scale(1.2)
            rotate(2deg);

        opacity: 1;
    }

    100% {
        transform:
            scale(1)
            rotate(0);
    }
}


@keyframes turun {

    from {
        transform:
            translateY(-50px);

        opacity: 0;
    }

    to {
        transform:
            translateY(0);

        opacity: 1;
    }
}


@keyframes munculText {

    from {
        transform:
            scale(.3);

        opacity: 0;
    }

    to {
        transform:
            scale(1);

        opacity: 1;
    }
}


/* =========================================================
   CONFETTI
========================================================= */

.confetti {
    position: fixed;

    width: 10px;
    height: 18px;

    top: -30px;

    z-index: 1001;

    pointer-events: none;

    animation:
        confettiJatuh
        3s
        linear
        forwards;
}


@keyframes confettiJatuh {

    0% {
        transform:
            translateY(0)
            rotate(0);

        opacity: 1;
    }

    100% {
        transform:
            translateY(110vh)
            rotate(720deg);

        opacity: .1;
    }
}


/* =========================================================
   TOMBOL
========================================================= */

button {
    margin-top: 12px;

    padding: 12px 24px;

    border: none;

    border-radius: 11px;

    color: white;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 10px rgba(0,0,0,.5);

    transition:
        transform .2s,
        opacity .2s;
}


button:hover {
    transform: scale(1.04);
}


button:active {
    transform: scale(.96);
}


button:disabled {
    background: #555 !important;

    cursor: not-allowed;

    transform: none;

    opacity: .7;
}


#drawButton {
    background: #00b894;
}


#nextButton {
    display: none;

    background: #0984e3;
}


#smokeButton {
    display: none;

    background: #d63031;
}


#fastTimerButton {
    display: none;

    background: #e17055;
}


#restoreButton {
    display: none;

    background: #6c5ce7;
}


/* =========================================================
   TEKS
========================================================= */

#petunjuk {
    min-height: 25px;

    margin-top: 3px;

    padding: 0 15px;

    text-align: center;

    font-size: 16px;
    font-weight: bold;

    text-shadow:
        2px 2px 4px black;
}


#hasil {
    min-height: 42px;

    margin-top: 12px;

    padding: 0 15px;

    text-align: center;

    font-size: 28px;
    font-weight: bold;

    color: white;

    text-shadow:
        2px 2px 5px black,
        0 0 12px white;
}


/* =========================================================
   TIMER
========================================================= */

#timer {
    margin-top: 8px;

    font-size: 31px;
    font-weight: bold;

    color: #00ffcc;

    text-shadow:
        2px 2px 5px black,
        0 0 10px #00ffcc;
}


#timer.merah {
    color: red;

    text-shadow:
        2px 2px 5px black,
        0 0 12px red;
}


/* =========================================================
   CREATED BY
========================================================= */

.created-by {
    margin: 15px 0 20px;

    color: #FFD700;

    font-size: 16px;
    font-weight: bold;

    text-shadow:
        2px 2px 5px black,
        0 0 8px #FFD700;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 450px) {

    h1 {
        margin-top: 12px;
    }

    .glass {
        height: 270px;
    }

    .ball {
        width: 45px;
        height: 45px;

        font-size: 9px;
    }

    .slide-area {
        width: 280px;
    }

    .result-ball {
        width: 100px;
        height: 100px;
    }

    #hasil {
        font-size: 23px;
    }

    #timer {
        font-size: 27px;
    }

    button {
        max-width: 92vw;
    }

    .winner-text {
        font-size: 26px;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     JUDUL
======================================================= -->

<h1>
    🚭 BATAS MEROKOK HANYA 20 MENIT YA ABANG ABANG 🚭
</h1>


<!-- =======================================================
     MESIN UNDIAN
======================================================= -->

<div class="machine">

    <div
        class="glass"
        id="glass"
    ></div>


    <div class="slide-area">

        <div class="slide-left"></div>

        <div class="slide-right"></div>

        <div class="slide-bottom"></div>

    </div>


    <div
        class="result-ball"
        id="resultBall"
        onclick="bukaHasil()"
    >
        👆<br>
        TEKAN<br>
        BOLA
    </div>

</div>


<!-- =======================================================
     INFORMASI
======================================================= -->

<div id="petunjuk">
    🎲 Tekan tombol untuk mengundi
</div>


<div id="hasil">
</div>


<!-- =======================================================
     TIMER
======================================================= -->

<div id="timer">
    20:00
</div>


<!-- =======================================================
     TOMBOL
======================================================= -->

<button
    id="drawButton"
    onclick="mulaiUndian()"
>
    🎲 MULAI UNDIAN
</button>


<button
    id="nextButton"
    onclick="nextPerson()"
>
    ➡️ NEXT (Tidak Merokok)
</button>


<button
    id="smokeButton"
    onclick="merokok()"
>
    🚬 MEROKOK (20 MENIT)
</button>


<button
    id="fastTimerButton"
    onclick="percepatTimer()"
>
    ⚡ PERCEPAT TIMER
</button>


<button
    id="restoreButton"
    onclick="kembalikanNama()"
>
    🔄 Tambah Nama Kembali
</button>


<div class="created-by">
    ⏱️ Waktu: 20:00
    <br>
    Created by Agung
</div>


<!-- =======================================================
     POPUP PEMENANG
======================================================= -->

<div
    class="winner-overlay"
    id="winnerOverlay"
>

    <div class="winner-small">
        🎉 HASIL UNDIAN 🎉
    </div>


    <div
        class="winner-name"
        id="winnerName"
    ></div>


    <div class="winner-text">
        🏆 TERPILIH! 🏆
    </div>


    <button
        class="winner-close"
        onclick="tutupPemenang()"
    >
        👍 LANJUT
    </button>

</div>


<script>

/* =========================================================
   DAFTAR NAMA
========================================================= */

/*
   GANTI NAMA-NAMA DI BAWAH INI DENGAN PESERTA ANDA.

   Contoh:

   const daftarNamaAwal = [
       "Agung",
       "Budi",
       "Candra",
       "Dedi",
       "Eko"
   ];
*/

const daftarNamaAwal = [
    "Agung",
    "Nanda",
    "Dafa",
    "Tio",
    "Kojek",
    "Ibra",
    "Roy",
    "Aji"
];


/* =========================================================
   VARIABEL
========================================================= */

let namaTersedia = [...daftarNamaAwal];

let namaTerpilih = null;

let namaTerakhir = null;

let sedangUndian = false;

let timerInterval = null;

let waktuTersisa = 20 * 60;


/* =========================================================
   ELEMEN HTML
========================================================= */

const glass = document.getElementById("glass");

const resultBall =
    document.getElementById("resultBall");

const winnerOverlay =
    document.getElementById("winnerOverlay");

const winnerName =
    document.getElementById("winnerName");

const petunjuk =
    document.getElementById("petunjuk");

const hasil =
    document.getElementById("hasil");

const timerElement =
    document.getElementById("timer");

const drawButton =
    document.getElementById("drawButton");

const nextButton =
    document.getElementById("nextButton");

const smokeButton =
    document.getElementById("smokeButton");

const fastTimerButton =
    document.getElementById("fastTimerButton");

const restoreButton =
    document.getElementById("restoreButton");


/* =========================================================
   WARNA BOLA
========================================================= */

const warnaBola = [
    "#ff7675",
    "#74b9ff",
    "#55efc4",
    "#ffeaa7",
    "#a29bfe",
    "#fd79a8",
    "#fab1a0",
    "#81ecec",
    "#fdcb6e"
];


/* =========================================================
   MEMBUAT BOLA
========================================================= */

function buatBola() {

    glass.innerHTML = "";

    if (namaTersedia.length === 0) {
        return;
    }

    namaTersedia.forEach((nama, index) => {

        const ball =
            document.createElement("div");

        ball.className = "ball";

        ball.textContent = nama;

        ball.dataset.nama = nama;

        ball.style.background =
            warnaBola[
                index % warnaBola.length
            ];

        /* Posisi awal acak */
        const maxX =
            Math.max(20, glass.clientWidth - 65);

        const maxY =
            Math.max(20, glass.clientHeight - 65);

        ball.style.left =
            Math.random() * maxX + "px";

        ball.style.top =
            Math.random() * maxY + "px";

        glass.appendChild(ball);
    });
}


/* =========================================================
   GERAKKAN BOLA
========================================================= */

function gerakkanBola() {

    const bola =
        document.querySelectorAll(".ball");

    bola.forEach(ball => {

        const maxX =
            Math.max(20, glass.clientWidth - 65);

        const maxY =
            Math.max(20, glass.clientHeight - 65);

        ball.style.left =
            Math.random() * maxX + "px";

        ball.style.top =
            Math.random() * maxY + "px";
    });
}


/* =========================================================
   ANIMASI UNDIAN
========================================================= */

function mulaiUndian() {

    if (sedangUndian) {
        return;
    }

    if (namaTersedia.length === 0) {

        petunjuk.textContent =
            "🎉 Semua nama sudah terpilih!";

        hasil.textContent =
            "Tidak ada peserta tersisa.";

        drawButton.disabled = true;

        return;
    }


    sedangUndian = true;

    drawButton.disabled = true;

    nextButton.style.display = "none";

    smokeButton.style.display = "none";

    fastTimerButton.style.display = "none";

    resultBall.classList.remove("show");
    resultBall.classList.remove("goyang");


    petunjuk.textContent =
        "🎲 Mengocok bola...";


    hasil.textContent = "";


    buatBola();


    /* Kocok bola selama beberapa detik */

    let jumlahKocokan = 0;

    const intervalKocok =
        setInterval(() => {

            gerakkanBola();

            jumlahKocokan++;

            if (jumlahKocokan >= 15) {

                clearInterval(intervalKocok);

                pilihPemenang();
            }

        }, 150);

}


/* =========================================================
   PILIH PEMENANG
========================================================= */

function pilihPemenang() {

    if (namaTersedia.length === 0) {
        selesaiUndian();
        return;
    }


    const index =
        Math.floor(
            Math.random() *
            namaTersedia.length
        );


    namaTerpilih =
        namaTersedia[index];


    namaTerakhir =
        namaTerpilih;


    /* Hapus dari daftar tersedia */

    namaTersedia.splice(index, 1);


    /* Tampilkan bola hasil */

    resultBall.innerHTML =
        "👆<br>TEKAN<br>BOLA";

    resultBall.classList.remove("show");
    resultBall.classList.remove("goyang");


    /*
       Memaksa browser melakukan reflow
       supaya animasi bisa dimulai ulang.
    */

    void resultBall.offsetWidth;


    resultBall.classList.add("show");


    setTimeout(() => {

        resultBall.classList.add("goyang");

    }, 850);


    petunjuk.textContent =
        "🎯 Bola sudah keluar! Tekan bola.";


    sedangUndian = false;

    drawButton.disabled = false;
}


/* =========================================================
   BUKA HASIL
========================================================= */

function bukaHasil() {

    if (!namaTerpilih) {
        return;
    }


    winnerName.textContent =
        namaTerpilih;


    winnerOverlay.classList.add("show");


    buatConfetti();
}


/* =========================================================
   TUTUP PEMENANG
========================================================= */

function tutupPemenang() {

    winnerOverlay.classList.remove("show");


    resultBall.classList.remove("goyang");


    petunjuk.textContent =
        "🎯 Pilih tindakan untuk " +
        namaTerpilih;


    hasil.textContent =
        "Terpilih: " + namaTerpilih;


    /*
       Setelah popup ditutup,
       pengguna memilih:
       - NEXT
       - MEROKOK
    */

    nextButton.style.display =
        "inline-block";

    smokeButton.style.display =
        "inline-block";


    drawButton.style.display =
        "none";


    restoreButton.style.display =
        "inline-block";
}


/* =========================================================
   NEXT - TIDAK MEROKOK
========================================================= */

function nextPerson() {

    if (!namaTerpilih) {
        return;
    }


    clearInterval(timerInterval);

    timerInterval = null;


    hasil.textContent =
        "✅ " + namaTerpilih +
        " selesai / tidak merokok.";


    petunjuk.textContent =
        "🎲 Siap untuk peserta berikutnya.";


    namaTerpilih = null;


    resultBall.classList.remove("show");
    resultBall.classList.remove("goyang");


    nextButton.style.display =
        "none";

    smokeButton.style.display =
        "none";

    fastTimerButton.style.display =
        "none";

    drawButton.style.display =
        "inline-block";

    drawButton.disabled = false;


    resetTimer();

    buatBola();
}


/* =========================================================
   MEROKOK
========================================================= */

function merokok() {

    if (!namaTerpilih) {
        return;
    }


    nextButton.style.display =
        "none";

    smokeButton.style.display =
        "none";

    fastTimerButton.style.display =
        "inline-block";


    drawButton.disabled = true;


    waktuTersisa =
        20 * 60;


    updateTimer();


    petunjuk.textContent =
        "🚬 " + namaTerpilih +
        " sedang merokok. Waktu tersisa:";


    hasil.textContent =
        "🚬 " + namaTerpilih;


    mulaiTimer();
}


/* =========================================================
   TIMER
========================================================= */

function mulaiTimer() {

    clearInterval(timerInterval);


    timerInterval =
        setInterval(() => {

            waktuTersisa--;

            updateTimer();


            if (waktuTersisa <= 0) {

                clearInterval(timerInterval);

                timerInterval = null;

                waktuHabis();
            }

        }, 1000);
}


/* =========================================================
   UPDATE TIMER
========================================================= */

function updateTimer() {

    const menit =
        Math.floor(waktuTersisa / 60);

    const detik =
        waktuTersisa % 60;


    timerElement.textContent =
        String(menit).padStart(2, "0") +
        ":" +
        String(detik).padStart(2, "0");


    if (waktuTersisa <= 60) {

        timerElement.classList.add("merah");

    } else {

        timerElement.classList.remove("merah");
    }
}


/* =========================================================
   PERCEPAT TIMER
========================================================= */

/*
   Setiap tombol ditekan,
   timer dipercepat 1 menit.

   Contoh:
   20:00 -> 19:00 -> 18:00 -> dst.
*/

function percepatTimer() {

    if (!timerInterval) {
        return;
    }


    waktuTersisa =
        Math.max(
            0,
            waktuTersisa - 60
        );


    updateTimer();


    if (waktuTersisa <= 0) {

        clearInterval(timerInterval);

        timerInterval = null;

        waktuHabis();
    }
}


/* =========================================================
   WAKTU HABIS
========================================================= */

function waktuHabis() {

    clearInterval(timerInterval);

    timerInterval = null;


    timerElement.textContent =
        "00:00";


    timerElement.classList.add("merah");


    petunjuk.textContent =
        "⏰ Waktu 20 menit sudah habis!";


    hasil.textContent =
        "🚬 Waktu merokok selesai untuk " +
        namaTerpilih;


    fastTimerButton.style.display =
        "none";


    /*
       Nama bisa dikembalikan
       setelah timer selesai.
    */

    restoreButton.style.display =
        "inline-block";


    drawButton.style.display =
        "inline-block";

    drawButton.disabled = false;


    nextButton.style.display =
        "inline-block";
}


/* =========================================================
   RESET TIMER
========================================================= */

function resetTimer() {

    clearInterval(timerInterval);

    timerInterval = null;

    waktuTersisa = 20 * 60;

    timerElement.classList.remove("merah");

    updateTimer();
}


/* =========================================================
   KEMBALIKAN NAMA
========================================================= */

function kembalikanNama() {

    if (!namaTerakhir) {

        hasil.textContent =
            "Tidak ada nama yang bisa dikembalikan.";

        return;
    }


    /*
       Jangan masukkan dua kali.
    */

    if (!namaTersedia.includes(namaTerakhir)) {

        namaTersedia.push(namaTerakhir);
    }


    hasil.textContent =
        "🔄 " + namaTerakhir +
        " telah ditambahkan kembali.";


    petunjuk.textContent =
        "🎲 Nama sudah tersedia untuk undian berikutnya.";


    namaTerpilih = null;


    restoreButton.style.display =
        "none";

    nextButton.style.display =
        "none";

    smokeButton.style.display =
        "none";

    fastTimerButton.style.display =
        "none";


    resultBall.classList.remove("show");
    resultBall.classList.remove("goyang");


    drawButton.style.display =
        "inline-block";

    drawButton.disabled = false;


    resetTimer();

    buatBola();
}


/* =========================================================
   CONFETTI
========================================================= */

function buatConfetti() {

    const warna = [
        "#FFD700",
        "#ff7675",
        "#74b9ff",
        "#55efc4",
        "#fd79a8",
        "#a29bfe",
        "#ffeaa7"
    ];


    for (let i = 0; i < 80; i++) {

        const confetti =
            document.createElement("div");


        confetti.className =
            "confetti";


        confetti.style.left =
            Math.random() * 100 + "vw";


        confetti.style.background =
            warna[
                Math.floor(
                    Math.random() *
                    warna.length
                )
            ];


        confetti.style.animationDuration =
            (2 + Math.random() * 2) + "s";


        confetti.style.transform =
            "rotate(" +
            Math.random() * 360 +
            "deg)";


        document.body.appendChild(confetti);


        setTimeout(() => {

            confetti.remove();

        }, 4500);
    }
}


/* =========================================================
   STATUS AWAL
========================================================= */

function selesaiUndian() {

    drawButton.disabled = true;

    petunjuk.textContent =
        "🎉 Semua peserta sudah selesai.";

    hasil.textContent =
        "Tidak ada nama tersisa.";
}


/* =========================================================
   INISIALISASI
========================================================= */

window.addEventListener(
    "load",
    () => {

        resetTimer();

        buatBola();

        petunjuk.textContent =
            "🎲 Tekan tombol untuk mengundi";

    }
);

</script>


</body>

<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Undian Bola TV - Created by Agung</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    font-family:
        "Arial Black",
        Arial,
        sans-serif;

    color:white;

    display:flex;
    flex-direction:column;
    align-items:center;

    overflow-x:hidden;

    padding:10px 8px 30px;

    background:
        radial-gradient(
            circle at 50% 30%,
            #263b4a 0%,
            #101923 42%,
            #04070b 100%
        );

}


/* =========================================================
   CAHAYA RUANGAN
========================================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,220,255,.10),
            transparent 60%
        );

    z-index:-2;

}


/* =========================================================
   JUDUL
========================================================= */

h1{

    position:relative;

    margin:8px auto 12px;

    padding:9px 20px;

    max-width:95vw;

    text-align:center;

    color:white;

    font-size:
        clamp(15px,3.6vw,28px);

    letter-spacing:1px;

    background:
        linear-gradient(
            90deg,
            #061018,
            #12425a,
            #061018
        );

    border:2px solid #20d9ff;

    border-radius:9px;

    box-shadow:
        0 0 8px rgba(0,220,255,.9),
        0 0 25px rgba(0,220,255,.35),
        inset 0 0 15px rgba(0,220,255,.15);

    text-shadow:
        0 0 5px white,
        0 0 14px #00d9ff,
        2px 3px 4px black;

}


/* =========================================================
   TV BODY
========================================================= */

.machine{

    position:relative;

    width:min(96vw,590px);

    padding:
        25px
        22px
        34px;

    display:flex;

    flex-direction:column;

    align-items:center;

    background:

        linear-gradient(
            145deg,
            #424a50 0%,
            #181d21 25%,
            #060809 65%,
            #30363a 100%
        );

    border:10px solid #252b30;

    border-radius:36px;

    box-shadow:

        0 20px 50px rgba(0,0,0,.95),

        inset 0 0 18px
        rgba(255,255,255,.10),

        inset 0 -15px 30px
        rgba(0,0,0,.85);

}


/* antena */

.machine::before{

    content:"";

    position:absolute;

    top:-19px;

    left:50%;

    width:120px;

    height:25px;

    transform:translateX(-50%);

    border-top:4px solid #666;

    border-radius:50%;

}


.machine::after{

    content:"";

    position:absolute;

    top:-26px;

    left:50%;

    width:7px;

    height:30px;

    background:#555;

    transform:
        translateX(-50%)
        rotate(20deg);

    border-radius:5px;

}


/* =========================================================
   LAYAR CRT
========================================================= */

.glass{

    position:relative;

    width:410px;

    max-width:90vw;

    height:310px;

    overflow:hidden;

    border:
        9px solid #080b0e;

    border-radius:
        50px 50px 40px 40px;

    background:

        radial-gradient(
            ellipse at center,
            #173b47 0%,
            #0a1b23 50%,
            #020609 100%
        );

    box-shadow:

        inset 0 0 30px black,

        inset 0 0 80px
        rgba(0,0,0,.85),

        0 0 0 3px #59636a,

        0 0 0 6px #15191c,

        0 0 35px
        rgba(0,220,255,.3);

    animation:
        tvFlicker 6s infinite;

}


/* refleksi */

.glass::before{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:80;

    background:

        linear-gradient(
            115deg,
            rgba(255,255,255,.18),
            transparent 16%,
            transparent 70%,
            rgba(255,255,255,.04)
        );

}


/* scanline */

.glass::after{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:90;

    background:

        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.045) 0px,
            rgba(255,255,255,.045) 1px,
            rgba(0,0,0,.13) 2px,
            rgba(0,0,0,.13) 4px
        );

    animation:
        scanline 6s linear infinite;

    mix-blend-mode:overlay;

}


@keyframes scanline{

    from{
        background-position:0 0;
    }

    to{
        background-position:0 150px;
    }

}


@keyframes tvFlicker{

    0%,93%,100%{
        filter:brightness(1);
    }

    94%{
        filter:brightness(.85);
    }

    95%{
        filter:brightness(1.12);
    }

    96%{
        filter:brightness(.94);
    }

}


/* =========================================================
   BOLA
========================================================= */

.ball{

    position:absolute;

    width:50px;
    height:50px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:4px;

    font-size:10px;

    font-weight:900;

    color:#111;

    user-select:none;

    pointer-events:none;

    border:2px solid
        rgba(255,255,255,.9);

    background:

        radial-gradient(
            circle at 30% 20%,
            #fff 0%,
            #fff8c9 7%,
            #ffd83d 30%,
            #f39c12 65%,
            #7d4d00 100%
        );

    box-shadow:

        inset -10px -12px 14px
        rgba(0,0,0,.38),

        inset 8px 7px 12px
        rgba(255,255,255,.7),

        0 7px 10px
        rgba(0,0,0,.8);

    z-index:10;

    will-change:
        transform,
        left,
        top;

}


.ball::before{

    content:"";

    position:absolute;

    width:14px;
    height:14px;

    top:6px;
    left:8px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            white 0%,
            rgba(255,255,255,.7) 45%,
            transparent 75%
        );

}


/* =========================================================
   EFEK GERAK MESIN
========================================================= */

.machine.rolling .glass{

    animation:
        tvFlicker .4s infinite;

    box-shadow:

        inset 0 0 35px black,

        inset 0 0 80px rgba(0,0,0,.9),

        0 0 0 3px #59636a,

        0 0 35px
        rgba(0,220,255,.7),

        0 0 65px
        rgba(0,220,255,.25);

}


.machine.rolling{

    animation:
        mesinGoyang .12s infinite alternate;

}


@keyframes mesinGoyang{

    from{
        transform:translateX(-2px);
    }

    to{
        transform:translateX(2px);
    }

}


/* =========================================================
   SELUNCURAN
========================================================= */

.slide-area{

    width:320px;

    height:220px;

    position:relative;

}


.slide-left,
.slide-right{

    position:absolute;

    top:0;

    width:24px;

    height:205px;

    border-radius:20px;

    background:

        linear-gradient(
            90deg,
            #222,
            #eee 35%,
            #888 55%,
            #222
        );

    box-shadow:
        0 6px 10px black,
        inset 1px 0 2px white;

}


.slide-left{

    left:35px;

    transform:
        rotate(25deg);

    transform-origin:top;

}


.slide-right{

    right:35px;

    transform:
        rotate(-25deg);

    transform-origin:top;

}


.slide-bottom{

    position:absolute;

    bottom:10px;

    left:50%;

    transform:
        translateX(-50%);

    width:115px;
    height:30px;

    border-radius:16px;

    background:
        linear-gradient(
            #fff,
            #777,
            #222
        );

    box-shadow:

        0 7px 12px black,

        inset 0 2px 2px white;

}


/* =========================================================
   BOLA HASIL
========================================================= */

.result-ball{

    position:absolute;

    left:50%;

    bottom:-5px;

    width:118px;
    height:118px;

    transform:
        translateX(-50%);

    border-radius:50%;

    display:none;

    justify-content:center;
    align-items:center;

    text-align:center;

    color:#111;

    font-size:13px;

    font-weight:900;

    cursor:pointer;

    z-index:100;

    background:

        radial-gradient(
            circle at 28% 20%,
            #fff 0%,
            #fff 5%,
            #ff7675 15%,
            #e84118 45%,
            #900000 80%,
            #350000 100%
        );

    border:6px solid #ffd700;

    box-shadow:

        inset -18px -20px 22px
        rgba(0,0,0,.5),

        inset 10px 9px 15px
        rgba(255,255,255,.7),

        0 0 15px #ffd700,

        0 0 40px
        rgba(255,215,0,.7),

        0 15px 25px
        rgba(0,0,0,.8);

}


.result-ball.show{

    display:flex;

    animation:
        bolaKeluar .9s
        cubic-bezier(.17,1.5,.4,1);

}


@keyframes bolaKeluar{

    0%{

        transform:
            translate(-50%,-180px)
            scale(.1)
            rotate(-360deg);

        opacity:0;

    }

    45%{

        transform:
            translate(-50%,15px)
            scale(1.18)
            rotate(100deg);

        opacity:1;

    }

    70%{

        transform:
            translate(-50%,-8px)
            scale(.94)
            rotate(20deg);

    }

    100%{

        transform:
            translate(-50%,0)
            scale(1)
            rotate(0);

    }

}


.result-ball::before{

    content:"";

    position:absolute;

    width:24px;
    height:24px;

    top:13px;
    left:17px;

    border-radius:50%;

    background:white;

    opacity:.9;

}


/* =========================================================
   LAMPU TV
========================================================= */

.tv-light{

    position:absolute;

    right:18px;

    bottom:11px;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#ff2020;

    box-shadow:
        0 0 7px red,
        0 0 18px red;

    animation:
        blinkTV 1.2s infinite;

}


@keyframes blinkTV{

    0%,45%{
        opacity:1;
    }

    50%,100%{
        opacity:.25;
    }

}


/* =========================================================
   STATUS
========================================================= */

#petunjuk{

    margin-top:12px;

    padding:6px 15px;

    min-height:28px;

    text-align:center;

    color:#dffcff;

    font-size:15px;

    background:
        rgba(0,0,0,.6);

    border:
        1px solid
        rgba(0,220,255,.4);

    border-radius:20px;

    text-shadow:
        0 0 8px #00d9ff,
        2px 2px 3px black;

}


/* =========================================================
   HASIL
========================================================= */

#hasil{

    min-height:40px;

    margin-top:8px;

    font-size:27px;

    font-weight:bold;

    text-align:center;

    color:white;

    text-shadow:
        0 0 8px white,
        0 0 18px #00eaff,
        2px 2px 5px black;

}


/* =========================================================
   PANEL NAMA
========================================================= */

.name-panel{

    width:min(95vw,570px);

    margin-top:12px;

    padding:12px;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            #17232c,
            #080d11
        );

    border:
        1px solid
        rgba(0,220,255,.35);

    box-shadow:
        0 8px 20px rgba(0,0,0,.5),
        inset 0 0 15px rgba(0,220,255,.05);

}


.name-panel label{

    display:block;

    margin-bottom:7px;

    color:#00eaff;

    font-size:14px;

}


#namaInput{

    width:100%;

    min-height:75px;

    resize:vertical;

    padding:10px;

    color:white;

    background:#05090c;

    border:
        1px solid #31515d;

    border-radius:8px;

    outline:none;

    font-family:Arial,sans-serif;

}


#namaInput:focus{

    border-color:#00eaff;

    box-shadow:
        0 0 10px
        rgba(0,234,255,.25);

}


#jumlahNama{

    display:block;

    margin-top:6px;

    color:#aaa;

    font-size:12px;

}


/* =========================================================
   TIMER
========================================================= */

#timer{

    margin-top:10px;

    padding:6px 18px;

    color:#00ffcc;

    background:
        rgba(0,0,0,.65);

    border:
        2px solid #00ffcc;

    border-radius:8px;

    font-size:30px;

    font-weight:bold;

    text-shadow:
        0 0 10px #00ffcc,
        2px 2px 5px black;

}


#timer.merah{

    color:#ff3838;

    border-color:#ff3838;

    text-shadow:
        0 0 10px red,
        2px 2px 5px black;

    animation:
        timerDanger .6s infinite alternate;

}


@keyframes timerDanger{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.06);
    }

}


/* =========================================================
   TOMBOL
========================================================= */

button{

    margin-top:10px;

    min-width:230px;

    padding:12px 22px;

    border:none;

    border-radius:10px;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 6px 12px rgba(0,0,0,.65),
        inset 0 1px 1px rgba(255,255,255,.3);

    transition:
        transform .15s,
        filter .15s;

}


button:hover{

    transform:
        translateY(-2px)
        scale(1.02);

    filter:brightness(1.15);

}


button:active{

    transform:
        translateY(2px)
        scale(.97);

}


button:disabled{

    background:#444 !important;

    cursor:not-allowed;

    opacity:.6;

    transform:none;

}


#drawButton{

    background:
        linear-gradient(
            #19d3a2,
            #008f6c
        );

}


#nextButton{

    display:none;

    background:
        linear-gradient(
            #19a7ff,
            #0665a5
        );

}


#smokeButton{

    display:none;

    background:
        linear-gradient(
            #ff5757,
            #a50000
        );

}


#fastTimerButton{

    display:none;

    background:
        linear-gradient(
            #ff936c,
            #bd4828
        );

}


#restoreButton{

    background:
        linear-gradient(
            #9675ff,
            #4b2cb7
        );

}


/* =========================================================
   WINNER OVERLAY
========================================================= */

.winner-overlay{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    padding:20px;

    text-align:center;

    background:

        radial-gradient(
            circle at center,
            rgba(0,220,255,.22),
            rgba(0,0,0,.96) 70%
        );

    z-index:9999;

}


.winner-overlay.show{

    display:flex;

    animation:
        winnerIn .5s ease;

}


.winner-overlay::before{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.04) 0px,
            rgba(255,255,255,.04) 1px,
            transparent 2px,
            transparent 5px
        );

}


@keyframes winnerIn{

    from{

        opacity:0;

        filter:
            brightness(2)
            blur(3px);

    }

    to{

        opacity:1;

        filter:
            brightness(1)
            blur(0);

    }

}


.winner-small{

    position:relative;

    color:#00eaff;

    font-size:21px;

    letter-spacing:3px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff,
        2px 2px 5px black;

}


.winner-name{

    position:relative;

    margin:18px;

    color:white;

    font-size:
        clamp(40px,12vw,90px);

    font-weight:900;

    text-transform:uppercase;

    word-break:break-word;

    text-shadow:

        0 0 5px white,
        0 0 15px #00eaff,
        0 0 30px #00eaff,
        0 0 60px #008cff,
        5px 5px 5px black;

    animation:
        winnerName .9s
        cubic-bezier(.17,1.5,.4,1);

}


@keyframes winnerName{

    0%{

        transform:
            scale(.05)
            rotate(-10deg);

        opacity:0;

    }

    60%{

        transform:
            scale(1.2)
            rotate(2deg);

        opacity:1;

    }

    100%{

        transform:
            scale(1)
            rotate(0);

    }

}


.winner-text{

    position:relative;

    color:#ffd700;

    font-size:31px;

    text-shadow:
        0 0 10px #ffd700,
        0 0 25px #ff8c00,
        2px 2px 5px black;

    animation:
        winnerText .7s .3s both;

}


@keyframes winnerText{

    from{

        transform:scale(.2);

        opacity:0;

    }

    to{

        transform:scale(1);

        opacity:1;

    }

}


.winner-close{

    position:relative;

    min-width:130px;

    margin-top:28px;

    background:
        linear-gradient(
            #00d2a0,
            #008b6d
        );

}


/* =========================================================
   CONFETTI
========================================================= */

.confetti{

    position:fixed;

    top:-30px;

    width:9px;
    height:18px;

    z-index:10001;

    pointer-events:none;

    animation:
        confettiFall
        3.5s
        linear
        forwards;

}


@keyframes confettiFall{

    0%{

        transform:
            translateY(0)
            rotate(0);

        opacity:1;

    }

    100%{

        transform:
            translateY(110vh)
            rotate(900deg);

        opacity:.1;

    }

}


/* =========================================================
   CREATED
========================================================= */

.created-by{

    margin:15px 0 20px;

    color:#00eaff;

    font-size:14px;

    letter-spacing:2px;

    text-shadow:
        0 0 8px #00eaff,
        2px 2px 5px black;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:450px){

    body{
        padding-top:5px;
    }

    h1{
        font-size:15px;
        padding:7px 10px;
    }

    .machine{

        padding:
            18px
            10px
            28px;

        border-width:7px;

        border-radius:27px;

    }

    .glass{

        height:270px;

        border-width:8px;

    }

    .ball{

        width:43px;
        height:43px;

        font-size:8px;

    }

    .slide-area{
        width:280px;
    }

    .result-ball{

        width:100px;
        height:100px;

    }

    #hasil{
        font-size:22px;
    }

    #timer{
        font-size:26px;
    }

    button{

        min-width:210px;

        font-size:15px;

        padding:11px 16px;

    }

    .winner-small{
        font-size:16px;
    }

    .winner-text{
        font-size:24px;
    }

}


/* =========================================================
   REDUCE MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

    }

}

</style>

</head>


<body>


<h1>

</h1>


<!-- =======================================================
     MESIN TV

<div

>

    ></div>

<div
    class="winner-overlay"

        class="winner-close"
        onclick="tutupPemenang()"

</div>


<script>

/* =========================================================
   DATA
========================================================= */

let peserta = [];
let pesertaAktif = [];

let pemenangSekarang = null;

let timerInterval = null;

let waktu = 20 * 60;

let sedangUndian = false;

let physicsFrame = null;


/* =========================================================
   ELEMENT
========================================================= */

const glass =
    document.getElementById("glass");

const machine =
    document.getElementById("machine");

const namaInput =
    document.getElementById("namaInput");

const jumlahNama =
    document.getElementById("jumlahNama");

const petunjuk =
    document.getElementById("petunjuk");

const hasil =
    document.getElementById("hasil");

const resultBall =
    document.getElementById("resultBall");

const winnerOverlay =
    document.getElementById("winnerOverlay");

const winnerName =
    document.getElementById("winnerName");

const timerElement =
    document.getElementById("timer");

const drawButton =
    document.getElementById("drawButton");

const nextButton =
    document.getElementById("nextButton");

const smokeButton =
    document.getElementById("smokeButton");

const fastTimerButton =
    document.getElementById("fastTimerButton");

const restoreButton =
    document.getElementById("restoreButton");


/* =========================================================
   INPUT NAMA
========================================================= */

namaInput.addEventListener(
    "input",
    updateJumlahNama
);


function updateJumlahNama(){

    const daftar =
        namaInput.value
            .split("\n")
            .map(nama => nama.trim())
            .filter(nama => nama !== "");

    jumlahNama.textContent =
        daftar.length +
        " peserta";

}


/* =========================================================
   AMBIL NAMA
========================================================= */

function bacaNama(){

    return namaInput.value

        .split("\n")

        .map(nama => nama.trim())

        .filter(nama => nama !== "");

}


/* =========================================================
   BUAT BOLA
========================================================= */

function buatBola(nama){

    const bola =
        document.createElement("div");

    bola.className = "ball";

    bola.textContent = nama;

    bola.dataset.nama = nama;

    const maxX =
        glass.clientWidth - 52;

    const maxY =
        glass.clientHeight - 52;

    bola.x =
        Math.random() *
        Math.max(10,maxX);

    bola.y =
        Math.random() *
        Math.max(10,maxY);

    bola.vx =
        (Math.random() * 2 - 1) * 2.5;

    bola.vy =
        (Math.random() * 2 - 1) * 2.5;

    bola.rotation =
        Math.random() * 360;

    bola.rotationSpeed =
        (Math.random() * 2 - 1) * 4;

    glass.appendChild(bola);

    return bola;

}


/* =========================================================
   HAPUS BOLA
========================================================= */

function hapusBola(){

    glass
        .querySelectorAll(".ball")
        .forEach(ball => ball.remove());

}


/* =========================================================
   BUAT SEMUA BOLA
========================================================= */

function tampilkanSemuaBola(){

    hapusBola();

    pesertaAktif.forEach(
        nama => buatBola(nama)
    );

}


/* =========================================================
   ANIMASI FISIKA BOLA
========================================================= */

function mulaiFisika(){

    cancelAnimationFrame(
        physicsFrame
    );

    function frame(){

        const balls =
            [...glass.querySelectorAll(".ball")];

        const width =
            glass.clientWidth;

        const height =
            glass.clientHeight;

        balls.forEach(ball => {

            if(!ball.x)
                ball.x = 10;

            if(!ball.y)
                ball.y = 10;

            ball.x += ball.vx;

            ball.y += ball.vy;

            ball.rotation +=
                ball.rotationSpeed;


            const maxX =
                width - ball.offsetWidth;

            const maxY =
                height - ball.offsetHeight;


            if(ball.x <= 0){

                ball.x = 0;

                ball.vx =
                    Math.abs(ball.vx);

                ball.vx *= .98;

            }


            if(ball.x >= maxX){

                ball.x = maxX;

                ball.vx =
                    -Math.abs(ball.vx);

                ball.vx *= .98;

            }


            if(ball.y <= 0){

                ball.y = 0;

                ball.vy =
                    Math.abs(ball.vy);

                ball.vy *= .98;

            }


            if(ball.y >= maxY){

                ball.y = maxY;

                ball.vy =
                    -Math.abs(ball.vy);

                ball.vy *= .98;

            }


            ball.style.left =
                ball.x + "px";

            ball.style.top =
                ball.y + "px";

            ball.style.transform =
                "rotate(" +
                ball.rotation +
                "deg)";

        });


        /* benturan antar bola */

        for(
            let i = 0;
            i < balls.length;
            i++
        ){

            for(
                let j = i + 1;
                j < balls.length;
                j++
            ){

                const a = balls[i];

                const b = balls[j];

                const dx =
                    (b.x + 25) -
                    (a.x + 25);

                const dy =
                    (b.y + 25) -
                    (a.y + 25);

                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );

                const minDistance = 48;


                if(
                    distance > 0 &&
                    distance < minDistance
                ){

                    const nx =
                        dx / distance;

                    const ny =
                        dy / distance;

                    const relativeVelocity =
                        (a.vx - b.vx) * nx +
                        (a.vy - b.vy) * ny;


                    if(relativeVelocity < 0){

                        const impulse =
                            relativeVelocity *
                            .92;

                        a.vx -=
                            impulse * nx;

                        a.vy -=
                            impulse * ny;

                        b.vx +=
                            impulse * nx;

                        b.vy +=
                            impulse * ny;

                    }

                    const overlap =
                        minDistance -
                        distance;

                    a.x -=
                        nx * overlap / 2;

                    a.y -=
                        ny * overlap / 2;

                    b.x +=
                        nx * overlap / 2;

                    b.y +=
                        ny * overlap / 2;

                }

            }

        }


        physicsFrame =
            requestAnimationFrame(frame);

    }


    frame();

}


/* =========================================================
   ACAK BOLA
========================================================= */

function percepatGerakan(){

    const balls =
        [...glass.querySelectorAll(".ball")];

    balls.forEach(ball => {

        const arahX =
            Math.random() < .5 ? -1 : 1;

        const arahY =
            Math.random() < .5 ? -1 : 1;

        ball.vx =
            arahX *
            (3 + Math.random() * 4);

        ball.vy =
            arahY *
            (3 + Math.random() * 4);

    });

}


/* =========================================================
   MULAI UNDIAN
========================================================= */

function mulaiUndian(){

    if(sedangUndian)
        return;


    if(pesertaAktif.length === 0){

        pesertaAktif =
            bacaNama();

    }


    if(pesertaAktif.length === 0){

        alert(
            "Masukkan nama peserta terlebih dahulu!"
        );

        namaInput.focus();

        return;

    }


    sedangUndian = true;

    drawButton.disabled = true;

    restoreButton.disabled = true;

    nextButton.style.display = "none";

    smokeButton.style.display = "none";

    fastTimerButton.style.display = "none";


    resultBall.classList.remove("show");

    hasil.textContent = "";

    petunjuk.textContent =
        "🔴 LIVE • BOLA SEDANG DIUNDI...";


    tampilkanSemuaBola();

    mulaiFisika();

    machine.classList.add("rolling");


    /* buat bola makin cepat */

    percepatGerakan();


    setTimeout(
        percepatGerakan,
        600
    );

    setTimeout(
        percepatGerakan,
        1200
    );

    setTimeout(
        percepatGerakan,
        1800
    );


    /*
       Setelah beberapa detik,
       pilih pemenang.
    */

    setTimeout(
        pilihPemenang,
        3500
    );

}


/* =========================================================
   PILIH PEMENANG
========================================================= */

function pilihPemenang(){

    if(pesertaAktif.length === 0){

        sedangUndian = false;

        drawButton.disabled = false;

        return;

    }


    const index =
        Math.floor(
            Math.random() *
            pesertaAktif.length
        );


    pemenangSekarang =
        pesertaAktif[index];


    machine.classList.remove(
        "rolling"
    );


    /* hentikan semua bola */

    const balls =
        [...glass.querySelectorAll(".ball")];


    balls.forEach(
        ball => {

            ball.vx *= .15;

            ball.vy *= .15;

        }
    );


    petunjuk.textContent =
        "🎉 PEMENANG SUDAH DIPILIH!";


    hasil.textContent =
        "🏆 " +
        pemenangSekarang +
        " 🏆";


    /*
       Bola hasil
    */

    resultBall.innerHTML =
        "👆<br>TEKAN<br>BOLA";


    resultBall.classList.remove(
        "show"
    );


    void resultBall.offsetWidth;


    resultBall.classList.add(
        "show"
    );


    sedangUndian = false;

    drawButton.disabled = false;

    restoreButton.disabled = false;


    /*
       Hilangkan bola-bola kecil
       setelah hasil keluar
    */

    setTimeout(
        hapusBola,
        800
    );

}


/* =========================================================
   BUKA HASIL
========================================================= */

function bukaHasil(){

    if(!pemenangSekarang)
        return;


    winnerName.textContent =
        pemenangSekarang;


    winnerOverlay.classList.add(
        "show"
    );


    buatConfetti();


    resultBall.classList.remove(
        "show"
    );


    nextButton.style.display =
        "block";

    smokeButton.style.display =
        "block";

}


/* =========================================================
   TUTUP PEMENANG
========================================================= */

function tutupPemenang(){

    winnerOverlay.classList.remove(
        "show"
    );

}


/* =========================================================
   NEXT
========================================================= */

function nextPerson(){

    if(!pemenangSekarang)
        return;


    const index =
        pesertaAktif.indexOf(
            pemenangSekarang
        );


    if(index !== -1){

        pesertaAktif.splice(
            index,
            1
        );

    }


    /* kosongkan pemenang */

    pemenangSekarang = null;

    hasil.textContent = "";

    petunjuk.textContent =
        "➡️ Peserta berikutnya siap diundi";


    nextButton.style.display =
        "none";

    smokeButton.style.display =
        "none";


    resultBall.classList.remove(
        "show"
    );


    if(pesertaAktif.length === 0){

        petunjuk.textContent =
            "🎉 SEMUA PESERTA SUDAH TERPILIH!";

        drawButton.disabled = true;

        return;

    }


    drawButton.disabled = false;

    restoreButton.disabled = false;

}


/* =========================================================
   MEROKOK
========================================================= */

function merokok(){

    if(!pemenangSekarang)
        return;


    winnerOverlay.classList.remove(
        "show"
    );


    smokeButton.style.display =
        "none";

    nextButton.style.display =
        "none";

    fastTimerButton.style.display =
        "block";


    hasil.textContent =
        "🚬 " +
        pemenangSekarang +
        " sedang merokok";


    petunjuk.textContent =
        "⏱️ WAKTU MEROKOK 20 MENIT";


    mulaiTimer();

}


/* =========================================================
   TIMER
========================================================= */

function mulaiTimer(){

    clearInterval(
        timerInterval
    );


    waktu = 20 * 60;

    updateTimer();


    timerElement.classList.remove(
        "merah"
    );


    timerInterval =
        setInterval(
            () => {

                waktu--;

                updateTimer();


                if(waktu <= 60){

                    timerElement.classList.add(
                        "merah"
                    );

                }


                if(waktu <= 0){

                    clearInterval(
                        timerInterval
                    );

                    timerSelesai();

                }

            },
            1000
        );

}


/* =========================================================
   UPDATE TIMER
========================================================= */

function updateTimer(){

    const menit =
        Math.floor(
            waktu / 60
        );

    const detik =
        waktu % 60;


    timerElement.textContent =
        "⏱️ Waktu: " +
        String(menit).padStart(2,"0") +
        ":" +
        String(detik).padStart(2,"0");

}


/* =========================================================
   PERCEPAT TIMER
========================================================= */

function percepatTimer(){

    if(waktu > 30){

        waktu = 30;

        updateTimer();

        petunjuk.textContent =
            "⚡ TIMER DIPERCEPAT MENJADI 30 DETIK";

    }

    else{

        waktu = 5;

        updateTimer();

        petunjuk.textContent =
            "⚡ TIMER AKAN SELESAI...";

    }

}


/* =========================================================
   TIMER SELESAI
========================================================= */

function timerSelesai(){

    fastTimerButton.style.display =
        "none";


    timerElement.classList.remove(
        "merah"
    );


    petunjuk.textContent =
        "✅ WAKTU MEROKOK SELESAI";


    hasil.textContent =
        "🚭 WAKTU HABIS — LANJUT PESERTA BERIKUTNYA";


    nextButton.style.display =
        "block";


    smokeButton.style.display =
        "none";


    pemenangSekarang = null;

}


/* =========================================================
   KEMBALIKAN NAMA
========================================================= */

function kembalikanNama(){

    const daftar =
        bacaNama();


    if(daftar.length === 0){

        alert(
            "Daftar nama masih kosong!"
        );

        return;

    }


    pesertaAktif =
        [...daftar];


    pemenangSekarang =
        null;


    clearInterval(
        timerInterval
    );


    waktu =
        20 * 60;


    updateTimer();


    timerElement.classList.remove(
        "merah"
    );


    hasil.textContent = "";


    petunjuk.textContent =
        "🔄 Semua nama dikembalikan";


    nextButton.style.display =
        "none";

    smokeButton.style.display =
        "none";

    fastTimerButton.style.display =
        "none";


    drawButton.disabled =
        false;


    restoreButton.disabled =
        false;


    resultBall.classList.remove(
        "show"
    );


    tampilkanSemuaBola();

}


/* =========================================================
   CONFETTI
========================================================= */

function buatConfetti(){

    const warna = [

        "#00eaff",
        "#ffd700",
        "#ff4757",
        "#2ed573",
        "#a55eea",
        "#ff9f43",
        "#ffffff"

    ];


    for(
        let i = 0;
        i < 100;
        i++
    ){

        const confetti =
            document.createElement(
                "div"
            );


        confetti.className =
            "confetti";


        confetti.style.left =
            Math.random() * 100 +
            "vw";


        confetti.style.background =
            warna[
                Math.floor(
                    Math.random() *
                    warna.length
                )
            ];


        confetti.style.animationDelay =
            Math.random() * 1.5 +
            "s";


        confetti.style.transform =
            "rotate(" +
            Math.random() * 360 +
            "deg)";


        document.body.appendChild(
            confetti
        );


        setTimeout(
            () => confetti.remove(),
            5000
        );

    }

}


/* =========================================================
   INITIAL
========================================================= */

updateJumlahNama();

updateTimer();


/*
   Contoh nama otomatis.

   Jika ingin layar kosong,
   hapus bagian ini.
*/

namaInput.value =
`Andi
Budi
Candra
Dedi
Eko
Fajar
Gilang
Hendra
Irwan
Joko`;

updateJumlahNama();


pesertaAktif =
    bacaNama();


/* mulai animasi bola */

tampilkanSemuaBola();

mulaiFisika();

</script>

```html
<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Undian Bola - Created by Agung</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at center,
            #253447 0%,
            #101722 45%,
            #05080d 100%
        );

    font-family:
        "Arial Black",
        Arial,
        sans-serif;

    color:white;

    display:flex;
    flex-direction:column;
    align-items:center;

    overflow-x:hidden;

    padding:12px 8px 25px;

}


/* =====================================================
   EFEK CAHAYA RUANGAN
===================================================== */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,220,255,.08),
            transparent 60%
        );

    pointer-events:none;

    z-index:-2;

}


/* =====================================================
   JUDUL TV
===================================================== */

h1{

    position:relative;

    margin:8px auto 12px;

    padding:9px 22px;

    max-width:95vw;

    text-align:center;

    color:#fff;

    font-size:
        clamp(15px,3.5vw,27px);

    letter-spacing:1px;

    background:
        linear-gradient(
            90deg,
            #07131d,
            #12354a,
            #07131d
        );

    border:

        2px solid
        #25d9ff;

    border-radius:8px;

    box-shadow:

        0 0 8px rgba(37,217,255,.8),

        0 0 25px rgba(37,217,255,.3),

        inset 0 0 15px rgba(37,217,255,.15);

    text-shadow:

        0 0 5px white,

        0 0 12px #00d9ff,

        2px 3px 4px black;

}


/* =====================================================
   BODY TV
===================================================== */

.machine{

    position:relative;

    width:min(96vw,570px);

    padding:

        24px
        22px
        32px;

    display:flex;

    flex-direction:column;

    align-items:center;

    background:

        linear-gradient(
            145deg,
            #333b43,
            #101419 35%,
            #050708 70%,
            #252c31
        );

    border:

        10px solid #252b30;

    border-radius:

        35px;

    box-shadow:

        0 18px 45px rgba(0,0,0,.9),

        inset 0 0 15px rgba(255,255,255,.08),

        inset 0 -10px 25px rgba(0,0,0,.8);

}


/* =====================================================
   ANTENA / DEKORASI TV
===================================================== */

.machine::before{

    content:"";

    position:absolute;

    top:-18px;
    left:50%;

    width:100px;
    height:20px;

    transform:
        translateX(-50%);

    border-top:
        4px solid #555;

    border-radius:50%;

    opacity:.8;

}

.machine::after{

    content:"";

    position:absolute;

    top:-23px;
    left:50%;

    width:7px;
    height:28px;

    background:#555;

    transform:
        translateX(-50%)
        rotate(18deg);

    border-radius:5px;

}


/* =====================================================
   LAYAR CRT
===================================================== */

.glass{

    position:relative;

    width:390px;
    max-width:90vw;

    height:300px;

    overflow:hidden;

    border:

        9px solid #080b0e;

    border-radius:

        48px 48px 38px 38px;

    background:

        radial-gradient(
            ellipse at center,
            #19313c 0%,
            #09161d 65%,
            #020609 100%
        );

    box-shadow:

        inset 0 0 25px rgba(0,0,0,.95),

        inset 0 0 70px rgba(0,0,0,.65),

        0 0 0 3px #59636a,

        0 0 0 6px #15191c,

        0 0 30px rgba(0,220,255,.25);

}


/* =====================================================
   REFLEKSI KACA TV
===================================================== */

.glass::before{

    content:"";

    position:absolute;

    inset:0;

    background:

        linear-gradient(
            115deg,
            rgba(255,255,255,.18),
            transparent 18%,
            transparent 70%,
            rgba(255,255,255,.04)
        );

    pointer-events:none;

    z-index:30;

}


/* =====================================================
   SCANLINE CRT
===================================================== */

.glass::after{

    content:"";

    position:absolute;

    inset:0;

    background:

        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.045) 0px,
            rgba(255,255,255,.045) 1px,
            rgba(0,0,0,.10) 2px,
            rgba(0,0,0,.10) 4px
        );

    mix-blend-mode:overlay;

    pointer-events:none;

    z-index:40;

    animation:
        scanline 7s linear infinite;

}


@keyframes scanline{

    from{
        background-position:
            0 0;
    }

    to{
        background-position:
            0 120px;
    }

}


/* =====================================================
   EFEK FLICKER TV
===================================================== */

.glass{

    animation:
        tvFlicker 5s infinite;

}


@keyframes tvFlicker{

    0%,94%,100%{
        filter:
            brightness(1);
    }

    95%{
        filter:
            brightness(.88);
    }

    96%{
        filter:
            brightness(1.08);
    }

    97%{
        filter:
            brightness(.96);
    }

}


/* =====================================================
   BOLA
===================================================== */

.ball{

    width:52px;
    height:52px;

    position:absolute;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:4px;

    border-radius:50%;

    text-align:center;

    font-size:11px;

    font-weight:bold;

    color:#111;

    border:

        2px solid
        rgba(255,255,255,.85);

    background:

        radial-gradient(
            circle at 30% 22%,
            #fff 0%,
            #ffeaa7 8%,
            #ffd32a 35%,
            #f39c12 68%,
            #9c640c 100%
        );

    box-shadow:

        inset -10px -12px 14px
        rgba(0,0,0,.38),

        inset 8px 7px 12px
        rgba(255,255,255,.65),

        0 6px 10px
        rgba(0,0,0,.8);

    z-index:5;

    transition:

        left .28s ease,
        top .28s ease;

}


/* kilau bola */

.ball::before{

    content:"";

    position:absolute;

    width:14px;
    height:14px;

    top:6px;
    left:8px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            white 0%,
            rgba(255,255,255,.7) 45%,
            transparent 75%
        );

}


/* =====================================================
   SELUNCURAN
===================================================== */

.slide-area{

    width:320px;

    height:230px;

    position:relative;

}


/* besi kiri */

.slide-left{

    position:absolute;

    left:35px;
    top:0;

    width:24px;
    height:210px;

    border-radius:20px;

    background:

        linear-gradient(
            90deg,
            #292929,
            #eeeeee 35%,
            #8d8d8d 55%,
            #303030
        );

    transform:
        rotate(25deg);

    transform-origin:top;

    box-shadow:

        3px 6px 10px #000,

        inset 1px 0 2px white;

}


/* besi kanan */

.slide-right{

    position:absolute;

    right:35px;
    top:0;

    width:24px;
    height:210px;

    border-radius:20px;

    background:

        linear-gradient(
            90deg,
            #292929,
            #eeeeee 35%,
            #8d8d8d 55%,
            #303030
        );

    transform:
        rotate(-25deg);

    transform-origin:top;

    box-shadow:

        -3px 6px 10px #000,

        inset -1px 0 2px white;

}


/* bawah */

.slide-bottom{

    position:absolute;

    bottom:15px;

    left:50%;

    transform:
        translateX(-50%);

    width:110px;
    height:30px;

    border-radius:15px;

    background:

        linear-gradient(
            #fafafa,
            #777,
            #292929
        );

    box-shadow:

        0 7px 12px #000,

        inset 0 2px 2px white;

}


/* =====================================================
   BOLA HASIL
===================================================== */

.result-ball{

    position:absolute;

    bottom:-2px;

    left:50%;

    transform:
        translateX(-50%);

    width:115px;
    height:115px;

    border-radius:50%;

    display:none;

    justify-content:center;
    align-items:center;

    text-align:center;

    color:#111;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    background:

        radial-gradient(
            circle at 28% 20%,
            #fff 0%,
            #fff5f5 5%,
            #ff7675 15%,
            #e84118 45%,
            #9b0000 78%,
            #400000 100%
        );

    border:

        6px solid #ffd700;

    box-shadow:

        inset -18px -20px 22px
        rgba(0,0,0,.48),

        inset 10px 9px 15px
        rgba(255,255,255,.65),

        0 0 15px #ffd700,

        0 0 40px
        rgba(255,215,0,.7),

        0 15px 25px
        rgba(0,0,0,.8);

    z-index:50;

}


.result-ball.show{

    display:flex;

    animation:

        bolaKeluar
        .8s
        cubic-bezier(.2,1.4,.4,1),

        bolaGoyang
        1s
        1s
        infinite
        alternate;

}


@keyframes bolaKeluar{

    0%{

        transform:
            translate(-50%,-160px)
            scale(.15)
            rotate(-180deg);

        opacity:0;

    }

    45%{

        transform:
            translate(-50%,15px)
            scale(1.18)
            rotate(90deg);

        opacity:1;

    }

    75%{

        transform:
            translate(-50%,-5px)
            scale(.95)
            rotate(20deg);

    }

    100%{

        transform:
            translate(-50%,0)
            scale(1)
            rotate(0);

    }

}


@keyframes bolaGoyang{

    from{

        transform:
            translate(-50%,0)
            rotate(-4deg);

    }

    to{

        transform:
            translate(-50%,0)
            rotate(4deg);

    }

}


/* =====================================================
   LAMPU TV
===================================================== */

.machine > .tv-light{

    position:absolute;

    bottom:10px;
    right:18px;

    width:9px;
    height:9px;

    border-radius:50%;

    background:#ff3030;

    box-shadow:
        0 0 7px red,
        0 0 15px red;

    animation:
        blinkTV 1.2s infinite;

}


@keyframes blinkTV{

    0%,45%{
        opacity:1;
    }

    50%,100%{
        opacity:.25;
    }

}


/* =====================================================
   STATUS LIVE
===================================================== */

#petunjuk{

    margin-top:12px;

    min-height:25px;

    padding:5px 15px;

    text-align:center;

    font-size:15px;

    font-weight:bold;

    color:#dffcff;

    background:
        rgba(0,0,0,.55);

    border:
        1px solid
        rgba(0,220,255,.35);

    border-radius:20px;

    text-shadow:
        0 0 8px #00d9ff,
        2px 2px 3px black;

}


/* =====================================================
   HASIL
===================================================== */

#hasil{

    min-height:42px;

    margin-top:10px;

    text-align:center;

    font-size:28px;

    font-weight:bold;

    color:white;

    text-shadow:

        0 0 8px white,

        0 0 18px #00eaff,

        2px 2px 5px black;

}


/* =====================================================
   TIMER
===================================================== */

#timer{

    margin-top:8px;

    padding:5px 18px;

    font-size:31px;

    font-weight:bold;

    color:#00ffcc;

    background:
        rgba(0,0,0,.6);

    border:
        2px solid
        #00ffcc;

    border-radius:8px;

    text-shadow:

        0 0 8px #00ffcc,

        2px 2px 5px black;

    box-shadow:

        inset 0 0 12px rgba(0,255,204,.15),

        0 0 12px rgba(0,255,204,.25);

}


#timer.merah{

    color:#ff3838;

    border-color:#ff3838;

    text-shadow:

        0 0 10px red,

        2px 2px 5px black;

    box-shadow:

        0 0 15px rgba(255,0,0,.5);

    animation:
        timerDanger .7s infinite alternate;

}


@keyframes timerDanger{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.06);
    }

}


/* =====================================================
   TOMBOL
===================================================== */

button{

    margin-top:10px;

    padding:12px 24px;

    min-width:230px;

    border:

        2px solid
        rgba(255,255,255,.25);

    border-radius:10px;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:

        0 5px 12px rgba(0,0,0,.65),

        inset 0 1px 1px
        rgba(255,255,255,.3);

    transition:

        transform .15s ease,
        filter .15s ease,
        box-shadow .15s ease;

}


button:hover{

    transform:
        translateY(-2px)
        scale(1.025);

    filter:
        brightness(1.15);

}


button:active{

    transform:
        translateY(2px)
        scale(.97);

}


button:disabled{

    background:#444 !important;

    cursor:not-allowed;

    transform:none;

    opacity:.7;

}


/* tombol utama */

#drawButton{

    background:

        linear-gradient(
            #19d3a2,
            #008f6c
        );

    box-shadow:

        0 0 15px
        rgba(0,255,190,.25),

        0 6px 12px black;

}


#nextButton{

    display:none;

    background:

        linear-gradient(
            #19a7ff,
            #0665a5
        );

}


#smokeButton{

    display:none;

    background:

        linear-gradient(
            #ff5757,
            #a50000
        );

}


#restoreButton{

    display:none;

    background:

        linear-gradient(
            #9675ff,
            #4b2cb7
        );

}


#fastTimerButton{

    background:

        linear-gradient(
            #ff8b62,
            #bd4828
        );

}


/* =====================================================
   OVERLAY PEMENANG
===================================================== */

.winner-overlay{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    padding:20px;

    background:

        radial-gradient(
            circle at center,
            rgba(0,225,255,.18),
            rgba(0,0,0,.96) 70%
        );

    z-index:999;

}


/* scanline overlay */

.winner-overlay::before{

    content:"";

    position:absolute;

    inset:0;

    background:

        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.035) 0,
            rgba(255,255,255,.035) 1px,
            transparent 2px,
            transparent 5px
        );

    pointer-events:none;

}


.winner-overlay.show{

    display:flex;

    animation:
        munculOverlay .4s ease;

}


@keyframes munculOverlay{

    from{
        opacity:0;
        filter:brightness(2);
    }

    to{
        opacity:1;
        filter:brightness(1);
    }

}


/* =====================================================
   PEMENANG
===================================================== */

.winner-small{

    position:relative;

    color:#00eaff;

    font-size:22px;

    font-weight:bold;

    letter-spacing:3px;

    text-shadow:

        0 0 8px #00eaff,

        0 0 20px #00eaff,

        2px 2px 5px black;

    animation:
        turun .5s ease;

}


.winner-name{

    position:relative;

    margin:15px 20px;

    text-align:center;

    color:white;

    font-size:

        clamp(45px,12vw,90px);

    font-weight:900;

    text-transform:uppercase;

    text-shadow:

        0 0 5px white,

        0 0 15px #00eaff,

        0 0 30px #00eaff,

        0 0 55px #008cff,

        5px 5px 5px #000;

    animation:

        zoomNama
        .8s
        cubic-bezier(.17,1.4,.4,1);

}


.winner-text{

    position:relative;

    color:#ffd700;

    font-size:32px;

    font-weight:bold;

    letter-spacing:2px;

    text-shadow:

        0 0 10px #ffd700,

        0 0 25px #ff8c00,

        2px 2px 5px black;

    animation:
        munculText .8s .3s both;

}


.winner-close{

    position:relative;

    margin-top:30px;

    padding:13px 32px;

    min-width:auto;

    border:none;

    border-radius:12px;

    background:

        linear-gradient(
            #00d2a0,
            #008b6d
        );

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:

        0 5px 20px black,

        0 0 20px rgba(0,255,200,.25);

}


@keyframes zoomNama{

    0%{

        transform:
            scale(.1)
            rotate(-8deg);

        opacity:0;

    }

    60%{

        transform:
            scale(1.2)
            rotate(2deg);

        opacity:1;

    }

    100%{

        transform:
            scale(1)
            rotate(0);

    }

}


@keyframes turun{

    from{

        transform:
            translateY(-50px);

        opacity:0;

    }

    to{

        transform:
            translateY(0);

        opacity:1;

    }

}


@keyframes munculText{

    from{

        transform:
            scale(.3);

        opacity:0;

    }

    to{

        transform:
            scale(1);

        opacity:1;

    }

}


/* =====================================================
   CONFETTI
===================================================== */

.confetti{

    position:fixed;

    width:10px;
    height:18px;

    top:-30px;

    z-index:1001;

    pointer-events:none;

    animation:

        confettiJatuh
        3s
        linear
        forwards;

}


@keyframes confettiJatuh{

    0%{

        transform:
            translateY(0)
            rotate(0);

        opacity:1;

    }

    100%{

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:.1;

    }

}


/* =====================================================
   CREATED BY
===================================================== */

.created-by{

    margin:15px 0 20px;

    color:#00eaff;

    font-size:14px;

    font-weight:bold;

    letter-spacing:2px;

    text-shadow:

        0 0 8px #00eaff,

        2px 2px 5px black;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:450px){

    body{
        padding-top:6px;
    }

    h1{

        margin-top:5px;

        padding:7px 12px;

        font-size:15px;

    }

    .machine{

        padding:
            18px
            12px
            28px;

        border-width:7px;

        border-radius:27px;

    }

    .glass{

        height:270px;

        border-width:8px;

    }

    .ball{

        width:45px;
        height:45px;

        font-size:9px;

    }

    .slide-area{

        width:280px;

    }

    .result-ball{

        width:100px;
        height:100px;

    }

    #hasil{

        font-size:23px;

    }

    #timer{

        font-size:27px;

    }

    button{

        min-width:210px;

        font-size:16px;

        padding:11px 18px;

    }

    .winner-small{

        font-size:17px;

    }

    .winner-text{

        font-size:25px;

    }

}


/* =====================================================
   REDUCE MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        scroll-behavior:
            auto !important;

    }

}

</style>

</head>

<!-- =====================================================

</div>
